<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ember &amp; Thyme — a tiny bistro cooking game</title>
<link rel="icon" href="data:,">
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2e2118; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  /* Read aloud, never shown: the status line screen readers announce. */
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
</style>
</head>
<body>
<canvas id="game" width="1280" height="720" aria-label="Ember and Thyme: a cooking game. Take orders, chop, cook, bake, plate and serve before guests walk out."></canvas>
<p id="status" role="status" aria-live="polite"></p>
<script type="module">
  import { Game } from './src/main.js';
  const canvas = document.getElementById('game');
  const game = new Game(canvas);
  window.__game = game; // exposed for automated play-testing only
  game.start();
</script>
</body>
</html>
